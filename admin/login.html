<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Colbios Sports</title>
  <link rel="stylesheet" href="/admin/static/css/admin.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-box">

      <div class="login-logo">
        <div class="logo-mark">
          <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="9" stroke="white" stroke-width="2" fill="none"/>
            <path d="M10 3 L10 17 M3 10 L17 10" stroke="white" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="logo-text">Colbios <span>Sports</span></div>
      </div>

      <h1 class="login-title">Admin Login</h1>
      <p class="login-subtitle">Sign in to access the control panel.</p>

      <div class="login-error" id="login-error">Invalid username or password.</div>

      <div class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="admin" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="login-btn" id="login-btn">Sign In</button>
      </div>

      <p class="login-hint">Default credentials: admin / admin123</p>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    fetch('/auth/check').then(r => r.json()).then(d => {
      if (d.authenticated) window.location.href = '/admin/dashboard';
    });

    function attemptLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('login-error');
      err.style.display = 'none';

      if (!username || !password) {
        err.textContent = 'Please enter your username and password.';
        err.style.display = 'block';
        return;
      }

      fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      })
        .then(r => r.json())
        .then(d => {
          if (d.success) {
            window.location.href = '/admin/dashboard';
          } else {
            err.textContent = d.error || 'Invalid credentials.';
            err.style.display = 'block';
          }
        })
        .catch(() => {
          err.textContent = 'Server error. Please try again.';
          err.style.display = 'block';
        });
    }

    document.getElementById('login-btn').addEventListener('click', attemptLogin);
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') attemptLogin();
    });
  </script>
</body>
</html>
